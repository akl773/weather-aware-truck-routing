[project]
name = "truck-routing-api"
version = "0.1.0"
description = "Weather-aware truck routing API"
requires-python = ">=3.14"
dependencies = [
    "django>=5.2.18,<5.3",
    "djangorestframework>=3.18",
    "drf-spectacular>=0.30",
    "gunicorn>=26.2",
    "redis>=8.1",
]

[dependency-groups]
dev = [
    "pytest>=9.1",
    "pytest-django>=4.14",
    "pytest-env>=1.8.1",
    "ruff>=0.17",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q --strict-markers"
# Tests run with production settings (DEBUG off), which require a secret key.
env = ["DJANGO_SECRET_KEY=test-only-secret-key"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "DJ", "PT", "RUF"]
