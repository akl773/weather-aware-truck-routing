# One origin for the app and its API (deployment D2). TLS ends at the Cloudflare tunnel (D3).
# Docker's DNS, re-read every 10 s, so a recreated api container is found at its new address.
resolver 127.0.0.11 valid=10s ipv6=off;

# Every request arrives through the Cloudflare tunnel, so the client is in CF-Connecting-IP. The
# API spends keyed provider quota, so each client gets a budget.
map $http_cf_connecting_ip $client_ip {
    ""      $remote_addr;
    default $http_cf_connecting_ip;
}
limit_req_zone $client_ip zone=per_client:10m rate=5r/s;
limit_req_status 429;

upstream api {
    zone api 64k;
    server api:8000 resolve;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    location /api/ {
        # Typing in a place field sends a burst of suggestions requests; allow that, not a flood.
        limit_req zone=per_client burst=30 nodelay;
        proxy_pass http://api;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        # A plan fans out to routing and weather providers; gunicorn gives up first, at 60 s.
        proxy_read_timeout 65s;
    }

    # Vite fingerprints everything under /assets, so a file there never changes.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
